<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fdf9f4">
  <title>전선함 ♥ 정혜련 · 감사드립니다</title>
  <meta name="description" content="저희의 시작을 함께 축복해 주셔서 진심으로 감사드립니다. 보내주신 따뜻한 마음 오래도록 간직하며 서로 아끼고 사랑하며 살겠습니다.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="전선함 ♥ 정혜련 · 감사드립니다">
  <meta property="og:description" content="저희의 시작을 함께 축복해 주셔서 진심으로 감사드립니다.">
  <meta property="og:image" content="https://seonhamm.github.io/wedding/og.jpg?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://seonhamm.github.io/wedding/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="전선함 ♥ 정혜련 · 감사드립니다">
  <meta name="twitter:description" content="저희의 시작을 함께 축복해 주셔서 진심으로 감사드립니다.">
  <meta name="twitter:image" content="https://seonhamm.github.io/wedding/og.jpg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">
  <script>if(new URLSearchParams(location.search).has('bw'))document.documentElement.classList.add('bw');</script>
  <style>
    * { box-sizing: border-box; }
    :root { --iv: #fdf9f4; --ww: #faf3ea; --cr: #f0e6d6; --tp: #9b8570; --dk: #4a3c30; --gd: #c4a882; }
    html { background: var(--iv); }
    body { margin: 0; color: var(--dk); font-family: 'Noto Serif KR', serif; -webkit-font-smoothing: antialiased; }
    main { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 36px 24px; }
    .card { width: 100%; max-width: 424px; padding: 64px 20px 60px; border: 1px solid var(--cr); background: var(--ww); text-align: center; animation: appear 1.2s ease both; }
    .label { margin: 0; font: 400 12px 'Cormorant Garamond', serif; letter-spacing: 5px; color: var(--tp); text-indent: 5px; }
    .ornament { display: block; width: 88px; height: 32px; margin: 28px auto 32px; color: var(--gd); }
    h1 { margin: 0; font-size: 16px; font-weight: 300; line-height: 2.5; letter-spacing: -.3px; }
    .promise { margin: 26px 0 0; font-size: 14px; font-weight: 300; line-height: 2.5; letter-spacing: -.4px; }
    .line { width: 32px; height: 1px; margin: 36px auto 28px; background: var(--gd); }
    .names { margin: 0; font-size: 14px; font-weight: 300; letter-spacing: 3px; }
    .amp { margin: 0 7px; color: var(--gd); font: italic 22px 'Cormorant Garamond', serif; letter-spacing: 0; }
    .signature { margin: 12px 0 0; font-size: 11px; font-weight: 300; letter-spacing: 3px; color: var(--tp); }
    html.bw, html.bw * { color: #000 !important; }
    @keyframes appear { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 359px) {
      main { padding: 24px 16px; }
      .card { padding: 48px 12px; }
      h1 { font-size: 14px; }
      .promise { font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  </style>
</head>
<body>
  <main>
    <article class="card" aria-labelledby="thank-you">
      <p class="label">WITH GRATITUDE</p>
      <svg class="ornament" viewBox="0 0 88 32" fill="none" aria-hidden="true">
        <path d="M2 16h27m30 0h27" stroke="currentColor" stroke-width=".7"/>
        <path d="M44 24s-11-6.5-11-13a5.5 5.5 0 0 1 11-1 5.5 5.5 0 0 1 11 1c0 6.5-11 13-11 13Z" stroke="currentColor" stroke-width=".8"/>
      </svg>
      <h1 id="thank-you">저희의 시작을 함께 축복해 주셔서<br>진심으로 감사드립니다.</h1>
      <p class="promise">보내주신 따뜻한 마음 오래도록 간직하며<br>서로 아끼고 사랑하며 살겠습니다.</p>
      <div class="line" aria-hidden="true"></div>
      <p class="names">전선함<span class="amp">&amp;</span>정혜련</p>
      <p class="signature">올림</p>
    </article>
  </main>
</body>
</html>
